<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universo de Soyin</title>
    <!-- Tailwind CSS para la interfaz de usuario -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Fuentes de Google para un toque romántico -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Dancing+Script:wght@700&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
    
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050505;
            font-family: 'Montserrat', sans-serif;
            color: white;
            user-select: none;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none; /* Deja pasar los clics al canvas 3D */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .pointer-events-auto {
            pointer-events: auto;
        }

        .title-font {
            font-family: 'Dancing Script', cursive;
        }

        .serif-font {
            font-family: 'Cinzel', serif;
        }

        /* Tooltip flotante para los sentimientos */
        #tooltip {
            position: absolute;
            background: rgba(255, 215, 0, 0.15);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 215, 0, 0.4);
            padding: 8px 16px;
            border-radius: 20px;
            color: #ffd700;
            font-family: 'Cinzel', serif;
            font-size: 1.2rem;
            pointer-events: none;
            opacity: 0;
            transform: translate(-50%, -150%);
            transition: opacity 0.3s ease, transform 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.1);
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        #tooltip.visible {
            opacity: 1;
            transform: translate(-50%, -120%);
        }

        /* Modal para los detalles de la foto */
        #detail-modal {
            background: rgba(10, 10, 15, 0.85);
            backdrop-filter: blur(15px);
            border-left: 2px solid rgba(255, 215, 0, 0.3);
            transform: translateX(100%);
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #detail-modal.open {
            transform: translateX(0);
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.2); 
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(255, 215, 0, 0.5); 
            border-radius: 10px;
        }

        /* Animación de carga */
        #loader {
            transition: opacity 1s ease;
        }

        /* Botón de música */
        #music-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(10, 10, 15, 0.7);
            border: 1px solid rgba(255, 215, 0, 0.4);
            color: #ffd700;
            padding: 6px 14px;
            font-size: 0.8rem;
            border-radius: 20px;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
            z-index: 20;
            pointer-events: auto;
            font-family: 'Cinzel', serif;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        #music-btn:hover {
            background: rgba(255, 215, 0, 0.2);
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <!-- Pantalla de carga -->
    <div id="loader" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-black pointer-events-auto">
        <h1 class="title-font text-5xl md:text-7xl text-yellow-400 mb-6 drop-shadow-lg">Para Soyin</h1>
        <div id="loader-spinner" class="w-16 h-16 border-4 border-yellow-600 border-t-yellow-300 rounded-full animate-spin"></div>
        <p id="loader-text" class="mt-4 text-gray-400 tracking-widest text-sm uppercase">Creando el universo...</p>
        <button id="start-btn" class="hidden mt-8 bg-yellow-600 hover:bg-yellow-500 text-black font-bold py-3 px-8 rounded-full transition-all shadow-[0_0_20px_rgba(202,138,4,0.6)] text-xl serif-font animate-pulse">Entra a mi secreto</button>
    </div>

    <!-- Contenedor 3D -->
    <div id="canvas-container"></div>

    <!-- Interfaz de Usuario 2D sobrepuesta -->
    <div id="ui-layer">
        
        <!-- Encabezado -->
        <header class="p-6 text-center md:text-left drop-shadow-md">
            <h1 class="title-font text-5xl md:text-6xl text-yellow-300 tracking-wide text-shadow">Mi Mundo Soyin</h1>
            <p class="text-gray-300 mt-2 text-sm md:text-base tracking-widest uppercase">Explora nuestros recuerdos</p>
        </header>

        <!-- Tooltip que sigue al ratón -->
        <div id="tooltip">Sentimiento</div>

        <!-- Panel Lateral para Detalles de la Foto -->
        <div id="detail-modal" class="absolute top-0 right-0 w-full md:w-96 h-full p-6 flex flex-col shadow-2xl pointer-events-auto z-20">
            <button id="close-btn" class="absolute top-4 right-6 text-gray-400 hover:text-white text-3xl transition-colors">&times;</button>
            
            <h2 class="serif-font text-2xl text-yellow-400 mb-6 mt-8 border-b border-yellow-600/30 pb-2">Un Momento Especial</h2>
            
            <!-- Imagen en grande sin recortes -->
            <div class="w-full h-72 bg-black rounded-lg overflow-hidden border border-yellow-600/50 shadow-lg relative flex items-center justify-center">
                <img id="detail-image" src="" alt="Recuerdo" class="max-w-full max-h-full object-contain z-10 hidden">
                <video id="detail-video" src="" controls class="max-w-full max-h-full object-contain z-10 hidden"></video>
                <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent pointer-events-none z-20"></div>
            </div>

            <div class="mt-4 flex items-center justify-center">
                <span id="detail-feeling" class="bg-yellow-900/40 text-yellow-300 px-4 py-1.5 rounded-full text-sm uppercase tracking-widest border border-yellow-500/30 shadow-[0_0_10px_rgba(255,215,0,0.2)]">Sentimiento</span>
            </div>

            <!-- Área de detalles con mensaje tierno -->
            <div class="mt-8 flex-grow flex flex-col items-center text-center">
                <div class="w-12 h-1 bg-yellow-600/50 rounded-full mb-6"></div>
                <p id="detail-text" class="text-3xl md:text-4xl text-yellow-100 title-font tracking-wide leading-relaxed px-2 drop-shadow-md"></p>
            </div>
        </div>

        <!-- Instrucciones en la parte inferior -->
        <footer class="p-4 text-center w-full bg-gradient-to-t from-black/80 to-transparent">
            <p class="text-xs md:text-sm text-gray-400">Arrastra para rotar el universo. Toca una foto para revelar sus detalles.</p>
        </footer>

        <!-- Botón de Música -->
        <button id="music-btn">
            <span id="music-icon">🔇</span> Reproducir Música
        </button>
    </div>

            34: { url: "https://scontent.fmga3-1.fna.fbcdn.net/v/t39.30808-6/719891139_122106790383352699_8772568563634356002_n.jpg?stp=cp6_dst-jpg_tt6&cstp=mx1220x2712&ctp=s1220x2712&_nc_cat=101&ccb=1-7&_nc_sid=833d8c&_nc_ohc=cDS5T5W24aAQ7kNvwFBVgsM&_nc_oc=AdqCXYH1Ar_BSR6THHNfXdzC-OwmnfwXCVqUWVQ7LI96-PNuSjVNcgIU0JZhdZ4wpWE&_nc_zt=23&_nc_ht=scontent.fmga3-1.fna&_nc_gid=4LbvvD09dRb2NE3ZPbG1Kw&_nc_ss=7b2a8&oh=00_Af8ihhnbipzwZn-mx2C-1UG0ND9uSF1NS_tHlrBhRKzd-Q&oe=6A317858", mensaje: "De tu mano a cualquier parte.", sentimiento: "Destino" },
            35: { url: "https://scontent.fmga11-2.fna.fbcdn.net/v/t39.30808-6/721118779_122106790431352699_2690622194160684198_n.jpg?stp=cp6_dst-jpg_tt6&cstp=mx1220x2712&ctp=s1220x2712&_nc_cat=102&ccb=1-7&_nc_sid=833d8c&_nc_ohc=7n_Iku0574oQ7kNvwEKlCHX&_nc_oc=AdqtnxQwA8X6_BejJAF8dy7yrf179rc998UwZkNgztE1HNLAY2rXBwJmKT42QZRtWcI&_nc_zt=23&_nc_ht=scontent.fmga11-2.fna&_nc_gid=S3pX1xXkL7Mf97lQZFU58w&_nc_ss=7b2a8&oh=00_Af__D5jCGXxgUqlQmhQFm09CQKELLjA_084nXBhvhQeqmw&oe=6A315D0D", mensaje: "La felicidad cabe en una fotografía.", sentimiento: "Alegría Pura" },
            36: { url: "https://scontent.fmga11-2.fna.fbcdn.net/v/t39.30808-6/722131833_122106790473352699_3524088800838262491_n.jpg?stp=cp6_dst-jpg_tt6&cstp=mx1220x2712&ctp=s1220x2712&_nc_cat=110&ccb=1-7&_nc_sid=833d8c&_nc_ohc=VfO7fcxWIRIQ7kNvwHxaYlm&_nc_oc=AdrpEdOmnv0itI_qd522f5gN2SeNk61p0I8a0j4xMrIzpcCRkM1vRR9eo218avgyrZY&_nc_zt=23&_nc_ht=scontent.fmga11-2.fna&_nc_gid=ClGDCJNWPMPq4BpDrd_JKQ&_nc_ss=7b2a8&oh=00_Af-yLTWtnplsf3bbZKJmcifB95sPuXaAL3DsSsjbJe0ZzA&oe=6A315DDD", mensaje: "Cada día te quiero más que ayer.", sentimiento: "Crecimiento" },
            37: { url: "https://scontent.fmga3-1.fna.fbcdn.net/v/t39.30808-6/720031184_122106790515352699_7848567133576526517_n.jpg?stp=cp6_dst-jpg_tt6&cstp=mx1220x2712&ctp=s1220x2712&_nc_cat=104&ccb=1-7&_nc_sid=833d8c&_nc_ohc=XVNz_6nHjKgQ7kNvwGcnh94&_nc_oc=AdpSbxdx1C7Fj7CQVwc4IhH8aa9M_a7BqRlY0-yeoxdXKGysXqhKy1qzAWId1o7FZ44&_nc_zt=23&_nc_ht=scontent.fmga3-1.fna&_nc_gid=g--K12e_ZjW3y6s2QpeWHA&_nc_ss=7b2a8&oh=00_Af8QLg_W1bB2Ja0JbkGY5tlr_bSuKkvHQU6d55BMNzoTFg&oe=6A3176D0", mensaje: "Siempre serás mi mayor certeza.", sentimiento: "Certeza" }
        };

        // Reajuste automático para la expansión de la esfera
        const recuerdosArray = Object.values(misRecuerdos);
        const ACTUAL_NUM_PHOTOS = recuerdosArray.length;
        
        // ¡LA ESFERA AHORA ES MÁS AMPLIA! 
        // Crece dinámicamente: para poquitas será pequeña, pero al tener 500 será enorme y espectacular.
        // Mientras más fotos, más radio.
        let ACTUAL_SPHERE_RADIUS;
        if (ACTUAL_NUM_PHOTOS <= 20) {
            ACTUAL_SPHERE_RADIUS = 250; 
        } else if (ACTUAL_NUM_PHOTOS <= 100) {
            ACTUAL_SPHERE_RADIUS = 400;
        } else {
            ACTUAL_SPHERE_RADIUS = 700; // Un universo gigante para cientos de fotos
        }

        // ==========================================
        // CONFIGURACIÓN THREE.JS
        // ==========================================
        
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050505, 0.0010); // Menos niebla para ver más lejos

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 3000);
        camera.position.z = ACTUAL_SPHERE_RADIUS + 400; // La cámara se aleja sola si la esfera crece

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.enablePan = false;
        controls.minDistance = 100;
        controls.maxDistance = 2000;
        // Rotación automática suave
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.5;

        // Luces
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);
        
        const pointLight = new THREE.PointLight(0xffd700, 1, 2000);
        pointLight.position.set(0, 0, 0);
        scene.add(pointLight);

        // Grupos
        const imageSphereGroup = new THREE.Group();
        const wordsGroup = new THREE.Group();
        scene.add(imageSphereGroup);
        scene.add(wordsGroup);

        // ==========================================
        // CREACIÓN DE LA ESFERA DE FOTOS
        // ==========================================
        
        const textureLoader = new THREE.TextureLoader();
        // IMPORTANTE: Permitir CORS para cargar imágenes de Facebook/Dropbox en el canvas 3D
        textureLoader.setCrossOrigin('anonymous');
        
        const raycastObjects = []; // Arreglo para detectar colisiones (hover/click)
        
        // Geometrías para la foto y el marco
        const photoGeometry = new THREE.PlaneGeometry(30, 30);
        const frameGeometry = new THREE.PlaneGeometry(34, 34);
        
        // Material del marco dorado
        const frameMaterial = new THREE.MeshBasicMaterial({ 
            color: 0xd4af37, // Dorado
            side: THREE.DoubleSide 
        });

        // Material por defecto de las fotos (antes de cargar)
        const defaultPhotoMaterial = new THREE.MeshBasicMaterial({ color: 0x222222, side: THREE.DoubleSide });

        // --- EFECTO MÁGICO (AURA TIERNA) PARA LOS MARCOS ---
        function createGlowTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 128; canvas.height = 128;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
            gradient.addColorStop(0, 'rgba(255, 215, 0, 0.8)');
            gradient.addColorStop(0.4, 'rgba(255, 150, 0, 0.4)');
            gradient.addColorStop(1, 'rgba(255, 215, 0, 0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 128, 128);
            return new THREE.CanvasTexture(canvas);
        }
        
        const glowTexture = createGlowTexture();
        const glowMaterial = new THREE.MeshBasicMaterial({
            map: glowTexture,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            opacity: 0.6
        });
        const glowGeometry = new THREE.PlaneGeometry(50, 50); // Un poco más grande para sobresalir
        const glowMeshes = [];

        // Distribuir puntos en una esfera usando la Espiral de Fibonacci
        const phi = Math.PI * (3 - Math.sqrt(5)); 
        
        for (let i = 0; i < ACTUAL_NUM_PHOTOS; i++) {
            const y = 1 - (i / (ACTUAL_NUM_PHOTOS - 1)) * 2; 
            const radiusAtY = Math.sqrt(1 - y * y);
            const theta = phi * i;

            const x = Math.cos(theta) * radiusAtY;
            const z = Math.sin(theta) * radiusAtY;

            // Posición final en la esfera
            const position = new THREE.Vector3(
                x * ACTUAL_SPHERE_RADIUS, 
                y * ACTUAL_SPHERE_RADIUS, 
                z * ACTUAL_SPHERE_RADIUS
            );

            // Crear el marco
            const frameMesh = new THREE.Mesh(frameGeometry, frameMaterial);
            frameMesh.position.copy(position);
            // Orientar el marco hacia afuera del centro de la esfera
            frameMesh.lookAt(new THREE.Vector3(0,0,0));
            // Voltear 180 grados para que la cara frontal apunte hacia la cámara exterior
            frameMesh.rotateY(Math.PI); 

            // Crear la foto (un poco adelante del marco para evitar z-fighting)
            const photoMesh = new THREE.Mesh(photoGeometry, defaultPhotoMaterial.clone());
            photoMesh.position.set(0, 0, 0.5); // Local al marco
            frameMesh.add(photoMesh);

            // Añadir el aura mágica detrás del marco
            const glowMesh = new THREE.Mesh(glowGeometry, glowMaterial);
            glowMesh.position.set(0, 0, -0.5); // Detrás del marco
            frameMesh.add(glowMesh);
            glowMeshes.push(glowMesh);

            // Tomamos estrictamente tus fotos configuradas
            const recuerdoPersonalizado = recuerdosArray[i]; 
            
            const urlFinal = recuerdoPersonalizado.url;
            const sentimientoFinal = recuerdoPersonalizado.sentimiento;
            const textoFinal = recuerdoPersonalizado.mensaje;
            const tipoFinal = recuerdoPersonalizado.type || 'image';

            // Datos personalizados para interactividad
            frameMesh.userData = {
                id: i,
                url: urlFinal,
                type: tipoFinal,
                feeling: sentimientoFinal,
                defaultText: textoFinal, 
                isHovered: false,
                originalScale: new THREE.Vector3(1, 1, 1),
                targetScale: new THREE.Vector3(1, 1, 1),
                photoMesh: photoMesh 
            };

            imageSphereGroup.add(frameMesh);
            raycastObjects.push(frameMesh);

            // Cargar textura dependiendo si es imagen o video
            setTimeout(() => {
                if (tipoFinal === 'video') {
                    const video = document.createElement('video');
                    video.src = urlFinal;
                    video.crossOrigin = 'anonymous';
                    video.loop = true;
                    video.muted = true; // Mutear para que funcione como textura sin cruzar audios
                    video.playsInline = true;
                    video.play();
                    
                    const videoTexture = new THREE.VideoTexture(video);
                    videoTexture.colorSpace = THREE.SRGBColorSpace;
                    photoMesh.material = new THREE.MeshBasicMaterial({ 
                        map: videoTexture,
                        side: THREE.DoubleSide
                    });
                } else {
                    textureLoader.load(urlFinal, (texture) => {
                        texture.colorSpace = THREE.SRGBColorSpace;
                        photoMesh.material = new THREE.MeshBasicMaterial({ 
                            map: texture,
                            side: THREE.DoubleSide
                        });
                    });
                }
            }, i * 25); 
        }

        // ==========================================
        // CREACIÓN DE LAS PALABRAS FLOTANTES
        // ==========================================
        
        function createTextTexture(text) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 512;
            canvas.height = 128;
            
            ctx.fillStyle = 'rgba(0, 0, 0, 0)'; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.font = 'bold 60px "Dancing Script", cursive';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            ctx.shadowColor = '#d4af37';
            ctx.shadowBlur = 15;
            
            const gradient = ctx.createLinearGradient(0, 0, canvas.width, 0);
            gradient.addColorStop(0, "#ffdf00");
            gradient.addColorStop(1, "#fff");
            ctx.fillStyle = gradient;
            
            ctx.fillText(text, canvas.width / 2, canvas.height / 2);
            
            const texture = new THREE.CanvasTexture(canvas);
            texture.needsUpdate = true;
            return texture;
        }

        // Las palabras flotan aún más lejos de la esfera de fotos
        const WORDS_RADIUS = ACTUAL_SPHERE_RADIUS + 200;
        for(let i = 0; i < NUM_WORDS; i++) {
            const word = palabrasUniverso[i % palabrasUniverso.length];
            const textTexture = createTextTexture(word);
            const spriteMaterial = new THREE.SpriteMaterial({ 
                map: textTexture, 
                transparent: true,
                opacity: 0.8
            });
            const sprite = new THREE.Sprite(spriteMaterial);
            
            sprite.scale.set(100, 25, 1);
            
            const u = Math.random();
            const v = Math.random();
            const theta = 2 * Math.PI * u;
            const phiWord = Math.acos(2 * v - 1);
            
            sprite.position.x = WORDS_RADIUS * Math.sin(phiWord) * Math.cos(theta);
            sprite.position.y = WORDS_RADIUS * Math.sin(phiWord) * Math.sin(theta);
            sprite.position.z = WORDS_RADIUS * Math.cos(phiWord);
            
            sprite.userData = {
                speed: Math.random() * 0.005 + 0.001,
                axis: new THREE.Vector3(Math.random()-0.5, Math.random()-0.5, Math.random()-0.5).normalize()
            };
            
            wordsGroup.add(sprite);
        }

        // ==========================================
        // FONDO ESTRELLADO (PARTÍCULAS)
        // ==========================================
        const starsGeometry = new THREE.BufferGeometry();
        const starsCount = 3000;
        const posArray = new Float32Array(starsCount * 3);
        
        for(let i = 0; i < starsCount * 3; i++) {
            posArray[i] = (Math.random() - 0.5) * 3000; // Ampliado para cubrir más fondo
        }
        
        starsGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const starsMaterial = new THREE.PointsMaterial({
            size: 2,
            color: 0xffffff,
            transparent: true,
            opacity: 0.8,
            sizeAttenuation: true
        });
        
        const starMesh = new THREE.Points(starsGeometry, starsMaterial);
        scene.add(starMesh);

        // ==========================================
        // INTERACTIVIDAD Y UI
        // ==========================================
        
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        
        const tooltip = document.getElementById('tooltip');
        let hoveredObj = null;

        window.addEventListener('mousemove', (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            tooltip.style.left = event.clientX + 'px';
            tooltip.style.top = event.clientY + 'px';
        });

        const detailModal = document.getElementById('detail-modal');
        const detailImage = document.getElementById('detail-image');
        const detailVideo = document.getElementById('detail-video');
        const detailFeeling = document.getElementById('detail-feeling');
        const detailText = document.getElementById('detail-text');
        const closeBtn = document.getElementById('close-btn');

        const musicBtn = document.getElementById('music-btn');
        const musicIcon = document.getElementById('music-icon');
        
        // Música de fondo configurada (Bruno Mars)
        const bgMusic = new Audio('https://dl.dropboxusercontent.com/scl/fi/jmz2t1x7rx981g626sa9h/Bruno-Mars-Risk-It-All-Lyrics.mp3?rlkey=3t5v90nhhz1drmrm9hvma8423&st=dpg150vu'); 
        bgMusic.loop = true;
        bgMusic.volume = 0.4;
        let isMusicPlaying = false;

        function toggleMusic(forcePlay) {
            if (forcePlay || !isMusicPlaying) {
                bgMusic.play().then(() => {
                    isMusicPlaying = true;
                    musicIcon.innerText = '🔊';
                    musicBtn.innerHTML = '<span id="music-icon">🔊</span> Pausar Música';
                }).catch(err => console.log("Autoplay bloqueado:", err));
            } else {
                bgMusic.pause();
                isMusicPlaying = false;
                musicIcon.innerText = '🔇';
                musicBtn.innerHTML = '<span id="music-icon">🔇</span> Reproducir Música';
            }
        }

        musicBtn.addEventListener('click', () => toggleMusic());

        window.addEventListener('click', (event) => {
            if(event.target.closest('#detail-modal') || event.target.closest('#music-btn') || event.target.closest('#start-btn')) return;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(raycastObjects);

            if (intersects.length > 0) {
                const object = intersects[0].object;
                const data = object.userData;

                if (data.type === 'video') {
                    detailImage.classList.add('hidden');
                    detailVideo.classList.remove('hidden');
                    detailVideo.src = data.url;
                    detailVideo.play();
                } else {
                    detailVideo.classList.add('hidden');
                    detailVideo.pause();
                    detailImage.classList.remove('hidden');
                    detailImage.src = data.url;
                }

                detailFeeling.innerText = data.feeling;
                detailText.innerText = data.defaultText;

                detailModal.classList.add('open');
                controls.autoRotate = false;
            } else {
                detailModal.classList.remove('open');
                controls.autoRotate = true;
            }
        });

        closeBtn.addEventListener('click', () => {
            detailModal.classList.remove('open');
            detailVideo.pause(); // Pausar video al cerrar
            controls.autoRotate = true;
        });

        // ==========================================
        // BUCLE DE ANIMACIÓN
        // ==========================================
        
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            
            const time = clock.getElapsedTime();
            controls.update();

            // Animar el aura mágica de los marcos (pulsación romántica suave)
            const pulse = Math.sin(time * 2) * 0.1 + 1; // Crece y se achica levemente
            const pulseOpacity = Math.sin(time * 1.5) * 0.2 + 0.6; // Su brillo parpadea
            glowMeshes.forEach(glow => {
                glow.scale.set(pulse, pulse, 1);
            });
            glowMaterial.opacity = pulseOpacity;

            wordsGroup.rotation.y = -time * 0.05;
            wordsGroup.rotation.z = time * 0.02;

            starMesh.rotation.y = time * 0.01;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(raycastObjects);

            if (hoveredObj && (intersects.length === 0 || intersects[0].object !== hoveredObj)) {
                hoveredObj.userData.targetScale.set(1, 1, 1);
                hoveredObj.material.color.setHex(0xd4af37); 
                tooltip.classList.remove('visible');
                document.body.style.cursor = 'default';
                hoveredObj = null;
            }

            if (intersects.length > 0) {
                const object = intersects[0].object;
                
                if (hoveredObj !== object) {
                    hoveredObj = object;
                    hoveredObj.userData.targetScale.set(1.4, 1.4, 1.4); 
                    hoveredObj.material.color.setHex(0xffffff); 
                    
                    tooltip.innerText = object.userData.feeling;
                    tooltip.classList.add('visible');
                    document.body.style.cursor = 'pointer';
                }
            }

            for(let i=0; i<raycastObjects.length; i++) {
                const obj = raycastObjects[i];
                obj.scale.lerp(obj.userData.targetScale, 0.1);
            }

            wordsGroup.children.forEach((sprite, index) => {
                sprite.position.y += Math.sin(time * 2 + index) * 0.5;
            });

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        window.onload = () => {
            // Mostrar botón para iniciar y habilitar música
            setTimeout(() => {
                const spinner = document.getElementById('loader-spinner');
                const text = document.getElementById('loader-text');
                const startBtn = document.getElementById('start-btn');
                
                if(spinner) spinner.style.display = 'none';
                if(text) text.style.display = 'none';
                if(startBtn) startBtn.classList.remove('hidden');
            }, 2500); 
            
            animate();
        };

        // Lógica del botón mágico
        document.getElementById('start-btn').addEventListener('click', () => {
            const loader = document.getElementById('loader');
            loader.style.opacity = '0';
            setTimeout(() => loader.remove(), 1000);
            
            // Iniciar la música automáticamente
            toggleMusic(true);
        });

    </script>
</body>
</html>
